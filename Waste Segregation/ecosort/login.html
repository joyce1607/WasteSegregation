<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoSort</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .auth-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .auth-logo i {
            color: var(--primary-color);
        }
        
        .login-type-tabs {
            display: flex;
            margin-bottom: 2rem;
            background: #f1f8e9;
            border-radius: 30px;
            padding: 0.3rem;
        }
        .login-tab {
            flex: 1;
            padding: 0.8rem;
            text-align: center;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            color: #555;
        }
        .login-tab.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
            background: white;
            color: #333;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .auth-btn {
            width: 100%;
            margin-top: 1rem;
            margin-bottom: 1rem;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }
        .auth-links {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-top: 1.5rem;
        }
        .auth-links a { color: var(--primary-color); text-decoration: none; }
        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #888;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <a href="index.html" class="auth-logo">
            <i class="fa-solid fa-leaf"></i> EcoSort
        </a>
        <h2 style="margin-bottom: 0.5rem; color: #333;">Welcome Back</h2>
        <p style="color: #666; margin-bottom: 2rem;">Sign in to continue sorting</p>
        
        <div class="login-type-tabs">
            <div class="login-tab active" id="tabCitizen" onclick="switchLogin('citizen')">👤 Citizen Login</div>
            <div class="login-tab" id="tabMunicipal" onclick="switchLogin('municipal')">🏙️ Municipal Login</div>
        </div>

        <form id="loginForm">
            <input type="hidden" id="loginType" value="citizen">
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div id="loginError" class="error-message">Invalid email or password.</div>
            
            <button type="submit" class="auth-btn btn-primary">Login</button>
        </form>
        
        <div class="auth-links">
            <a href="#">Forgot Password?</a>
            <a href="register.html">Create Account</a>
        </div>
        
        <div class="divider">
            <span>OR</span>
        </div>
        
        <button id="guestBtn" class="auth-btn btn-secondary">Continue as Guest</button>
    </div>
</div>

<script>
    function switchLogin(type) {
        document.getElementById('loginType').value = type;
        
        if (type === 'municipal') {
            document.getElementById('tabMunicipal').classList.add('active');
            document.getElementById('tabCitizen').classList.remove('active');
            document.getElementById('email').value = 'admin@municipal.gov';
            document.getElementById('password').value = 'admin123';
        } else {
            document.getElementById('tabCitizen').classList.add('active');
            document.getElementById('tabMunicipal').classList.remove('active');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }
    }
</script>
<script src="js/auth.js"></script>
</body>
</html>
