<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | EcoSort</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 550px;
            padding: 3rem 2.5rem;
        }
        .auth-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-align: center;
        }
        .auth-logo i {
            color: var(--primary-color);
        }
        .form-row {
            display: flex;
            gap: 1rem;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius-sm);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color var(--transition-fast);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .auth-btn {
            width: 100%;
            margin-top: 1rem;
        }
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="card auth-card">
        <a href="index.html" class="auth-logo">
            <i class="fa-solid fa-leaf"></i> EcoSort
        </a>
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Create Your Account</h2>
        <p class="text-muted" style="text-align: center; margin-bottom: 2rem;">Join the circular economy movement</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="houseNo">House Number</label>
                    <input type="text" id="houseNo" class="form-control" placeholder="e.g., 104, Block A">
                </div>
                <div class="form-group">
                    <label for="area">Area / Neighborhood</label>
                    <select id="area" class="form-control">
                        <option value="">Select Area</option>
                        <option value="North">North District</option>
                        <option value="South">South District</option>
                        <option value="East">East District</option>
                        <option value="West">West District</option>
                        <option value="Central">Central District</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            
            <div id="registerError" class="error-message"></div>
            
            <button type="submit" class="btn btn-primary auth-btn">Sign Up</button>
        </form>
        
        <div class="auth-links">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
